// ---------- model: MakeHuman base mesh, young male (CC0), already in A-pose ----------
const B = window.BODY;
const b64 = (s, T) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new T(u.buffer); };
const pos = b64(B.pos, Float32Array), index = b64(B.idx, Uint32Array);
const N = pos.length / 3;
const J = n => new THREE.Vector3(...B.joints[n]);
const vpart = new Int8Array(N);
const v = new THREE.Vector3();

// distance from a point to a polyline
function distLine(p, pts) {
  let d = 1e9;
  for (let k = 0; k < pts.length - 1; k++) {
    const a = pts[k], ab = pts[k + 1].clone().sub(a);
    const t = Math.min(1, Math.max(0, p.clone().sub(a).dot(ab) / ab.lengthSq()));
    d = Math.min(d, p.distanceTo(a.clone().addScaledVector(ab, t)));
  }
  return d;
}
const ARM = { r: ['r-shoulder', 'r-elbow', 'r-hand', 'r-finger-3-4'], l: ['l-shoulder', 'l-elbow', 'l-hand', 'l-finger-3-4'] };
const armPts = { r: ARM.r.map(J), l: ARM.l.map(J) };
const neckY = J('neck').y, chestY = 3.45, crotch = new THREE.Vector3(0, 0.15, 0);
function partAt(v) {
  const s = v.x >= 0 ? 'l' : 'r', sg = Math.sign(v.x) || 1;
  const sh = armPts[s][0], dir = armPts[s][1].clone().sub(sh).normalize();
  if (v.clone().sub(sh).dot(dir) > 0.05 && distLine(v, armPts[s]) < 0.95) {                     // arm (from the shoulder)
    const wr = armPts[s][2], fa = wr.clone().sub(armPts[s][1]).normalize();
    return v.clone().sub(wr).dot(fa) > -0.05 ? 0 : (s === 'r' ? 3 : 4);                          // the hand stays plain
  }
  if (v.y > neckY - 0.15) return 0;                                                                // face + neck
  if ((v.x - crotch.x) * -sg * 0.58 + (v.y - crotch.y) * 0.82 < 0)                                  // below the groin line
    return v.y > J(s + '-knee').y ? (s === 'r' ? 5 : 6) : v.y < J(s + '-ankle').y + 0.1 ? 0 : (s === 'r' ? 7 : 8);   // the foot stays plain
  return v.y > chestY ? 1 : 2;
}
for (let i = 0; i < N; i++) vpart[i] = partAt(v.fromArray(pos, i * 3));
let geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setIndex(new THREE.BufferAttribute(index, 1));
geo.computeVertexNormals();
const idx = index;
geo = geo.toNonIndexed();
const P = geo.attributes.position, M = P.count;
const tpart = new Float32Array(M);
for (let t = 0; t < M / 3; t++) {
  const a = vpart[idx[t * 3]], b = vpart[idx[t * 3 + 1]], c = vpart[idx[t * 3 + 2]];
  const p = (a === b || a === c) ? a : (b === c ? b : a);
  tpart[t * 3] = tpart[t * 3 + 1] = tpart[t * 3 + 2] = p;
}
geo.setAttribute('part', new THREE.BufferAttribute(tpart, 1));

// ---------- per-part frames: axis along the part, front toward the camera ----------
const UP = new THREE.Vector3(0, 1, 0), FRONT = new THREE.Vector3(0, 0, 1);
const seg = (a, b) => [J(a), J(b)];
const AX = [
  [J('neck'), J('head-2')],
  [new THREE.Vector3(0, chestY, 0), J('neck')],
  [crotch, new THREE.Vector3(0, chestY, 0)],
  seg('r-finger-3-4', 'r-shoulder'), seg('l-finger-3-4', 'l-shoulder'),
  seg('r-knee', 'r-upper-leg'), seg('l-knee', 'l-upper-leg'),
  seg('r-ankle', 'r-knee'), seg('l-ankle', 'l-knee'),
];
const frames = AX.map(([a, b], p) => {
  const A = p <= 2 ? UP.clone() : b.clone().sub(a).normalize();      // image "up" points toward the body
  const F = FRONT.clone().sub(A.clone().multiplyScalar(FRONT.dot(A))).normalize();
  const S = new THREE.Vector3().crossVectors(A, F);
  return { O: a.clone().add(b).multiplyScalar(0.5), A, F, S, y0: 1e9, y1: -1e9, r: 0, n: 0, sum: new THREE.Vector3() };
});
const tmp = new THREE.Vector3();
for (let i = 0; i < M; i++) {
  const f = frames[tpart[i]]; tmp.fromBufferAttribute(P, i);
  f.sum.add(tmp); f.n++;
}
// torso centres = centroid of the part (keeps the picture centred on the body)
for (let p = 0; p <= 2; p++) { const f = frames[p]; const c = f.sum.clone().divideScalar(f.n); f.O.set(0, c.y, c.z); }
for (let i = 0; i < M; i++) {
  const f = frames[tpart[i]]; tmp.fromBufferAttribute(P, i).sub(f.O);
  const y = tmp.dot(f.A); f.y0 = Math.min(f.y0, y); f.y1 = Math.max(f.y1, y);
  f.r += tmp.addScaledVector(f.A, -y).length();
}
frames.forEach(f => f.r /= f.n);


// ---------- previews ----------
// for print: the full-size first frame of each work (media/<work>/poster.jpg); the unmade work 9 stays plain gray
const POSTER = { '01':'01-shrinking-to-fit', '02':'02-candidates-vs-recruiters', '03':'03-growing-to-fit', '06':'06-super-easy-apply',
                 '07':'07-match-catch', '11':'11-a-play-i', '12':'12-scroll-down-to-apply', 'cc':'the-corporate-cali' };
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(src)); i.src = src; });
function plainGray() { const c = document.createElement('canvas'); c.width = c.height = 16; const g = c.getContext('2d'); g.fillStyle = '#7a7a7a'; g.fillRect(0, 0, 16, 16); return c; }
// a better moment than the first frame where a full-size video exists (seconds)
const PRINT_FRAME = { '03':['03-growing-to-fit/growing-to-fit_1080.mp4', +(Q.get('t03') || 24)] };
function videoFrame([src, t]) {
  return new Promise((res, rej) => {
    const v = document.createElement('video'); v.muted = true; v.preload = 'auto';
    v.onloadeddata = () => { v.onseeked = () => res(v); v.currentTime = t; };
    v.onerror = () => rej(new Error(src)); v.src = 'media/' + src;
  });
}
function testCard(p) { const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 512, 512); g.fillStyle = '#c00'; g.font = 'bold 200px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('R' + p, 256, 200); g.fillStyle = '#00c'; g.fillRect(0, 440, 512, 72); return c; }
const imgs = Q.has('testtex') ? PARTS.map((w, p) => testCard(p)) : await Promise.all(PARTS.map(w => PRINT ? (w.id ? (PRINT_FRAME[w.id] ? videoFrame(PRINT_FRAME[w.id]) : loadImg('media/' + POSTER[w.id] + '/poster.jpg')) : plainGray())
                                                  : (w.thumb ? loadVideo(SITE + w.thumb) : plainGray() /* the face: plain body */)));
const aspect = imgs.map(im => (im.videoWidth || im.width) / (im.videoHeight || im.height));
const cellOf = p => [(p % 3) * CELL, Math.floor(p / 3) * CELL];
imgs.forEach((im, p) => actx.drawImage(im, ...cellOf(p), CELL, CELL));

const atlas = new THREE.CanvasTexture(atlasCv);
atlas.colorSpace = THREE.SRGBColorSpace; atlas.generateMipmaps = false; atlas.minFilter = THREE.LinearFilter;
atlas.flipY = false;

// ---------- the CV, as the ATS extracted it, in VGA letters: a 128 x 64 character sheet that repeats ----------
await document.fonts.load('32px VGA');
await Promise.all(['300 20px "IBM Plex Sans Condensed"', '500 14px "IBM Plex Mono"'].map(f => document.fonts.load(f).catch(() => {})));
const COLS = 128, ROWS = 64, cvCv = document.createElement('canvas');
cvCv.width = COLS * 16; cvCv.height = ROWS * 32;
{
  const g = cvCv.getContext('2d'), txt = CV_TEXT.replace(/\s+/g, ' ');
  g.fillStyle = '#000'; g.fillRect(0, 0, cvCv.width, cvCv.height);
  g.fillStyle = '#fff'; g.font = '32px VGA'; g.textBaseline = 'top';
  let k = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { g.fillText(txt[k % txt.length], c * 16, r * 32 + 2); k++; }
}
const cvTex = new THREE.CanvasTexture(cvCv);
cvTex.wrapS = cvTex.wrapT = THREE.RepeatWrapping; cvTex.anisotropy = 8; cvTex.flipY = false;
const CV_H = CVMODE === 2 ? 0.2 : 0.13;                      // letter height in body units (the body is ~17 tall)

// The part and the wrapped picture coordinates are worked out per pixel, so the cuts are clean lines.
const hov = new Float32Array(9);
const mat = new THREE.ShaderMaterial({
  uniforms: {
    atlas: { value: atlas }, hov: { value: hov }, along: { value: LIMBS === 'along' ? 1 : 0 },
    // works whose picture stands upright on its limb instead of lying along it (Growing, Building a New Imaginary)
    upr: { value: PART_WORK.map(id => ['03', 'cc', '12'].includes(id) ? 1 : 0) },
    armR: { value: armPts.r }, armL: { value: armPts.l },
    neckY: { value: neckY }, chestY: { value: chestY }, kneeR: { value: J('r-knee').y }, kneeL: { value: J('l-knee').y },
    ankleR: { value: J('r-ankle').y }, ankleL: { value: J('l-ankle').y },
    fO: { value: frames.map(f => f.O) }, fA: { value: frames.map(f => f.A) },
    fF: { value: frames.map(f => f.F) }, fS: { value: frames.map(f => f.S) },
    fY: { value: frames.map(f => new THREE.Vector2((f.y0 + f.y1) / 2, f.y1 - f.y0)) },
    fR: { value: frames.map(f => f.r) }, asp: { value: aspect },
    cvTex: { value: cvTex }, cvMode: { value: CVMODE }, cvCell: { value: new THREE.Vector2(CV_H / 2, CV_H) },
    cvGrid: { value: new THREE.Vector2(COLS, ROWS) },
    scanY: { value: -99 }, scanMode: { value: SCANMODE }, time: { value: 0 }, scanGlow: { value: 0 },
    freeHov: { value: 0 },                                  // Untitled hovered: face, hands and feet turn turquoise
  },
  vertexShader: `
    varying vec3 vP; varying vec3 vN; varying vec3 vV;
    void main(){ vP = position; vN = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position,1.); vV = -mv.xyz; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `
    uniform sampler2D atlas; uniform float hov[9]; uniform float along; uniform float upr[9];
    uniform vec3 armR[4]; uniform vec3 armL[4];
    uniform float neckY, chestY, kneeR, kneeL, ankleR, ankleL;
    uniform vec3 fO[9]; uniform vec3 fA[9]; uniform vec3 fF[9]; uniform vec3 fS[9];
    uniform vec2 fY[9]; uniform float fR[9]; uniform float asp[9];
    uniform sampler2D cvTex; uniform float cvMode; uniform vec2 cvCell; uniform vec2 cvGrid;
    uniform float scanY, scanMode, time, scanGlow, freeHov;
    float hash(vec2 v){ return fract(sin(dot(v, vec2(12.9898, 78.233))) * 43758.5453); }
    varying vec3 vP; varying vec3 vN; varying vec3 vV;
    float dseg(vec3 p, vec3 a, vec3 b){ vec3 ab = b - a; float t = clamp(dot(p - a, ab) / dot(ab, ab), 0., 1.); return length(p - a - ab * t); }
    int partOf(vec3 v){
      bool l = v.x >= 0.; float sg = l ? 1. : -1.;
      vec3 a0 = l ? armL[0] : armR[0], a1 = l ? armL[1] : armR[1], a2 = l ? armL[2] : armR[2], a3 = l ? armL[3] : armR[3];
      float d = min(dseg(v, a0, a1), min(dseg(v, a1, a2), dseg(v, a2, a3)));
      if (dot(v - a0, normalize(a1 - a0)) > .05 && d < .95) return dot(v - a2, normalize(a2 - a1)) > -.05 ? 0 : (l ? 4 : 3);   // hands plain
      if (v.y > neckY - .15) return 0;
      if (v.x * -sg * .58 + (v.y - .15) * .82 < 0.) return v.y > (l ? kneeL : kneeR) ? (l ? 6 : 5) : v.y < (l ? ankleL : ankleR) + .1 ? 0 : (l ? 8 : 7);   // feet plain
      return v.y > chestY ? 1 : 2;
    }
    float fold(float x){ return 1. - abs(1. - mod(x, 2.)); }        // mirrored repeat behind the part
    void main(){
      int p = partOf(vP);
      vec3 q3 = vP - fO[p];
      float y = dot(q3, fA[p]), th = atan(dot(q3, fS[p]), dot(q3, fF[p]));
      float s = th * fR[p], ym = fY[p].x, len = fY[p].y;
      vec2 uv;
      if (p >= 3 && along > .5 && upr[p] < .5) { float Wd = len, Ht = Wd / asp[p]; uv = vec2(.5 + (y - ym) / Wd, .5 + s / Ht); }
      else { float Ht = len, Wd = Ht * asp[p]; uv = vec2(.5 + s / Wd, .5 + (y - ym) / Ht); }   // + : not mirrored

window.__snd = () => ({ on: sndOn, lit, state: audioCtx && audioCtx.state, gain: sndGain && +sndGain.gain.value.toFixed(2), playing: !!sndSrc, loop: sndBuf && sndBuf.duration, el: sndEl ? (sndEl.paused ? 'paused' : 'playing ' + sndEl.volume.toFixed(2)) : null });   // debugging
sndBtn.addEventListener('click', e => { e.preventDefault(); sndOn = !sndOn; try { localStorage.setItem('au_sound', sndOn ? 'on' : 'off'); } catch (err) {} sndLabel(); updateMusic(); });
// ---------- About the Author ----------
const aboutEl = document.querySelector('.about');
const IG = '<a href="https://www.instagram.com/calisterium/" target="_blank" rel="noopener">@calisterium</a>';
function renderAbout() {
  const a = T.about[lang];
  aboutEl.querySelector('h2').textContent = a.title;
  aboutEl.querySelector('.ab').innerHTML = a.p.map(t => '<p>' + t.replace('{ig}', IG) + '</p>').join('');
}
function setAbout(on) { aboutEl.classList.toggle('open', on); document.body.classList.toggle('ab', on); if (on) { renderAbout(); aboutEl.querySelector('.ap').scrollTop = 0; } }
document.querySelector('#head b').addEventListener('click', e => { e.stopPropagation(); setAbout(!aboutEl.classList.contains('open')); });
aboutEl.querySelector('.x').addEventListener('click', () => setAbout(false));
aboutEl.addEventListener('click', e => { if (e.target === aboutEl) setAbout(false); });
addEventListener('keydown', e => { if (e.key === 'Escape' && aboutEl.classList.contains('open')) setAbout(false); });
function setLang(l) {
  lang = l;
  try { localStorage.setItem('au_lang', l); } catch (e) {}
  sndLabel();
  if (aboutEl.classList.contains('open')) renderAbout();
  document.documentElement.lang = l;

  document.querySelectorAll('[data-t]').forEach(s => s.textContent = T[l][s.dataset.t]);
  fillLabels();
  if (current) fillInfo(current);
  if (current && (current.id === '12' || current.id === 'cc')) { const f = piece.querySelector('iframe'); if (f) f.src = pieceSrc(current); }
  if (W) resize();                                             // mob: the question is fitted in resize()
  onLang.forEach(f => f());
}
document.querySelectorAll('[data-lang]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); setLang(a.dataset.lang); }));
setLang(lang);
addEventListener('resize', resize);
resize();
// Shrinking waited ~3 s buffering before it moved (Carlos, 3 Nov): the video works are fetched quietly once the page is up, so
// the popup plays from the browser's media cache (01 whole, 2 MB; Growing only its metadata, it is 9 MB)
setTimeout(() => { PARTS.forEach(w => { if (w.id && w.piece && w.piece.video) { const v = document.createElement('video'); v.preload = w.id === '01' ? 'auto' : 'metadata'; v.muted = true; v.src = SITE + w.piece.video; } }); }, 2500);

// ---------- popup (same as the intermediate delivery site) ----------
const modal = document.createElement('div');
modal.className = 'modal';
modal.innerHTML = `<div class="panel">
  <div class="head2"><h2></h2><button class="x" aria-label="close">×</button></div>
  <div class="stage"><div class="piece"></div></div>
  <div class="info"></div>
</div>`;
document.body.appendChild(modal);
if (POP) modal.querySelector('.x').textContent = '[ X ]';
const panel = modal.querySelector('.panel'), head2 = modal.querySelector('.head2');
const stage = modal.querySelector('.stage'), piece = modal.querySelector('.piece');
function fillInfo(w) {
  const t = L[lang];
  modal.querySelector('h2').innerHTML = (POP ? '<span class="pn">[' + String(NUM[PARTS.indexOf(w)]).padStart(2, '0') + ']</span>' : '') + titleHTML(w);
  modal.querySelector('.info').innerHTML = `
    <table class="ced">
      <tr><th>${FORMAT_LABEL[lang]}</th><td>${FORMAT[w.id] ? FORMAT[w.id][lang] : ''}</td></tr>
      <tr><th>${t.artist}</th><td>Cali Sterium</td></tr>
      <tr><th>${t.series}</th><td>${lang === 'es' ? 'Desempleo Artificial' : 'Artificial Unemployment'}</td></tr>
      <tr><th>${t.date}</th><td>${w.date[lang]}</td></tr>
      <tr><th>${t.medium}</th><td>${(MEDIUM[w.id] || w.medium)[lang]}</td></tr>
    </table>` + (w.piece.sound ? '<div class="vsnd"><a href="#" id="vsndBtn"></a></div>' : '');
  const vb = modal.querySelector('#vsndBtn');
  if (vb) { vsndLabel(); vb.addEventListener('click', e => { e.preventDefault(); const v = piece.querySelector('video'); if (v) { v.muted = !v.muted; if (!v.muted) v.play().catch(() => {}); } vsndLabel(); }); }
}
// the sound switch of a video piece (Carlos, 3 Nov: Growing had no way to mute on a computer); it reads the real state of the video
function vsndLabel() { const vb = modal.querySelector('#vsndBtn'), v = piece.querySelector('video'); if (vb) vb.textContent = (lang === 'es' ? '[ sonido: ' : '[ sound: ') + (v && !v.muted ? 'on ]' : 'off ]'); }
function fit() {
  if (!current) return;
  let PW = panel.clientWidth, PH = panel.clientHeight - head2.offsetHeight, r = current.ratio;
  if (POP === 'b') { PW *= 0.86; PH -= 150; }

  const stacked = MOB || getComputedStyle(panel).display !== 'grid';
  if (POP === 'c' && !stacked) { PW = panel.clientWidth - head2.offsetWidth; PH = panel.clientHeight; }
  if (POP === 'c' && stacked) { PW = panel.clientWidth; PH = panel.clientHeight * 0.75 - 72; }
  let w = PW, h = PW / r;
  if (h > PH) { h = PH; w = PH * r; }

  piece.style.height = Math.floor(h) + 'px';
}
new ResizeObserver(fit).observe(panel);
// Holding the Gaze has its own Spanish page (scroll-down-to-apply_es.html); ?v: skip old cached copies
function pieceSrc(w) {
  const f = w.id === '12' && lang === 'es' ? w.piece.iframe.replace(/\.html$/, '_es.html') : w.piece.iframe;
  return SITE + f + '?v=20261103a' + (w.id === 'cc' && lang === 'es' ? '&lang=es' : '');   // cc: his CV in Spanish
}
function openWork(w) {
  current = w;
  fillInfo(w);
  const pc = w.piece;
  piece.style.background = pc.video ? '#000' : (pc.bg || '#000');   // a video covers its box: no light background that could peep out
  piece.classList.toggle('crop-bottom', w.id === '01');
  stage.style.background = POP ? '' : piece.style.background;   // dark styles: the stage keeps its CSS (opaque since 3 Nov)
  piece.innerHTML = pc.video
    ? `<video src="${SITE + pc.video}" autoplay loop playsinline preload="auto" ${pc.sound ? '' : 'muted'}></video>`
    : `<iframe src="${pieceSrc(w)}" allow="autoplay; fullscreen" title="${titleOf(w)}"></iframe>`;   // ?v: skip old cached copies
  if (w.id === '12') scrollHint();                              // Holding the Gaze: a nudge toward its scrollbar
  const fr = piece.querySelector('iframe');                     // Escape pressed inside a game (same origin) closes the popup too
  if (fr) fr.addEventListener('load', () => { try { fr.contentWindow.addEventListener('keydown', e => { if (e.key === 'Escape') closeWork(); }); } catch (e) {} });

  if (vd) { const pr = vd.play(); if (pr && pr.then) pr.then(vsndLabel, () => { vd.muted = true; vd.play().catch(() => {}); vsndLabel(); }); }

}
// a note at the top of Holding the Gaze, right next to its small green scrollbar; it goes away as soon as the
// scrollbar is used (scroll) or anything inside the piece is pressed
function scrollHint() {
  const h = document.createElement('div'); h.className = 'scroll-hint';
  const touch = MOB || matchMedia('(pointer: coarse)').matches;   // touch (Carlos, 3 Nov): no scrollbar to point at: SWIPE / DESLIZA, arrow down
  h.innerHTML = touch ? '<span>' + T[lang].swipe + '</span><b class="dn">&darr;</b>' : '<span>' + T[lang].scrolldown + '</span><b>&rarr;</b>';
  piece.appendChild(h);

  const watch = () => {
    try {

  };
  fr.addEventListener('load', watch);

  const iv = setInterval(() => {
    if (!h.isConnected) return clearInterval(iv);

  }, 250);
}
function closeWork() {

  current = null;

}
modal.querySelector('.x').addEventListener('click', closeWork);
modal.addEventListener('click', e => { if (e.target === modal) closeWork(); });

// Untitled (27 Oct): a click (its title, its button, or the face / hands / feet) switches the candidate to the white silhouette
// with the halo; another click on it, a click anywhere else on the page or Escape switches it back. Hover only colours the title.
let lit = false;
function setLit(on) { lit = on; document.body.classList.toggle('nl', on); updateMusic(); }
function openPart(p) {
  if (p === FREE) { setLit(!lit); return; }
  if (lit) setLit(false);
  if (p >= 0 && PARTS[p].id) openWork(PARTS[p]);
}
addEventListener('keydown', e => { if (e.key === 'Escape' && lit) setLit(false); });

// ---------- mouse: which part is under the cursor ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let target = -1;
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(body)[0];
  return hit ? partAt(hit.point) : -1;                         // face, hands and feet = A New Land (lights up green, coming soon)
}
function setTarget(p) {
  if (p === target) return;
  if (target >= 0) { labs[target].d.classList.remove('on'); labs[target].g.classList.remove('on'); applyBtns[target].classList.remove('on'); }
  target = p;
  if (p >= 0) { labs[p].d.classList.add('on'); labs[p].g.classList.add('on'); applyBtns[p].classList.add('on');
    if (MOB) requestAnimationFrame(() => labs[p].d.scrollIntoView({ block:'nearest', behavior:'smooth' })); }
  renderer.domElement.style.cursor = p >= 0 ? 'pointer' : '';
}
renderer.domElement.addEventListener('pointermove', e => { if (e.pointerType !== 'touch') setTarget(pick(e)); });

let tapped = -1;
renderer.domElement.addEventListener('click', e => {
  const p = pick(e);
  if (e.pointerType === 'touch') setTarget(p);                // the title shows below; one tap opens (Carlos, 3 Nov)
  openPart(p);
});
if (location.hash) { const w = PARTS.find(w => w.id && '#' + w.id === location.hash); if (w) openWork(w); }

// ---------- the scan line: top to bottom in 2.6 s, then a rest; numbers at its end, no names ----------
const scanEl = document.getElementById('scan'), roEl = scanEl.querySelector('.ro');
scanEl.classList.toggle('s2', SCANMODE === 2);
const SCAN_T = 2.6, SCAN_REST = 5.0, yTop = box.max.y + 0.2, yBot = box.min.y - 0.2;
let scanClock = 1e9, roN = 0;
function startScan() { if (SCANMODE) scanClock = 0; }
function placeScan(y) {
  mat.uniforms.scanY.value = y;
  if (!SCANMODE || y < yBot || y > yTop) { scanEl.classList.remove('on'); return; }
  mat.uniforms.scanGlow.value = 1;
  scanEl.classList.add('on');
  const p = screen(new THREE.Vector3(ctr.x, y, 1.2)), right = screen(new THREE.Vector3(box.max.x + 0.3, y, 0));
  scanEl.style.top = (p.y + OY) + 'px';
  roEl.style.left = (SCANMODE === 2 ? right.x : W - 230) + 'px';
  if ((roN++ & 7) === 0) roEl.textContent = (Math.random() * 100).toFixed(1).padStart(5) + '%  ' + Math.random().toFixed(3);
}

// ---------- the AI voice ----------
if (LOGPOS === '0') logEl.remove();
const voice = AIVOICE.make(+(Q.get('seed') || (Date.now() % 100000)));
const LOG_N = 4, logLines = [];
let typing = null, nextLine = 0;
function renderLog() {
  logEl.innerHTML = '';
  logLines.forEach((ln, k) => {
    const d = document.createElement('div'), full = voice.text(ln, lang);
    d.textContent = typing && k === logLines.length - 1 ? full.slice(0, typing.n) : full;
    d.style.setProperty('--o', (0.25 + 0.75 * (k + LOG_N - logLines.length) / (LOG_N - 1)).toFixed(2));
    if (k === logLines.length - 1) d.className = 'cur';
    logEl.appendChild(d);
  });
}
function pushLine(instant) {
  const ln = voice.next();
  logLines.push(ln); if (logLines.length > LOG_N) logLines.shift();
  typing = instant ? null : { n: 0 };
  if (voice.isScan(ln)) startScan();
  renderLog();
}
onLang.push(() => renderLog());

// ---------- loop ----------
let last = performance.now();
// ---------- the CV letters drip off the feet and run down to the bottom of the window ----------
// Same character grid as the letters on the body (planar mode), so the text keeps flowing at the same speed.
const DRIP_TXT = CV_TEXT.replace(/\s+/g, ' ');
const feet = [-1, 1].map(sg => {
  let x0 = 1e9, x1 = -1e9, z = -1e9;
  for (let i = 0; i < N; i++) {
    const x = pos[i * 3], y = pos[i * 3 + 1];
    if (y < box.min.y + 0.5 && Math.sign(x) === sg) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z = Math.max(z, pos[i * 3 + 2]); }
  }
  return { x0, x1, z: z - 0.4, y: box.min.y + 0.05 };
});

const h01 = (a, b) => { const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return v - Math.floor(v); };
function drawDrip() {
  dctx.clearRect(0, 0, W, H);
  if (hov[FREE] > 0.99) return;                              // A New Land hovered: no letters dripping either
  dctx.globalAlpha = 1 - hov[FREE];
  if (CVMODE !== 1 && CVMODE !== 2) return;
  const t = mat.uniforms.time.value, cw = CV_H / 2;
  const ppu = screen(new THREE.Vector3(0, box.min.y, feet[0].z)).y - screen(new THREE.Vector3(0, box.min.y + 1, feet[0].z)).y;
  const fpx = Math.max(6, Math.round(CV_H * ppu));
  dctx.font = fpx + 'px VGA'; dctx.textBaseline = 'top';
  for (const ft of feet) {
    const yFeet = ft.y;
    for (let c = Math.floor(ft.x0 / cw); c <= Math.floor(ft.x1 / cw); c++) {
      if (h01(c, 7) < 0.25) continue;                       // not every column runs
      const len = 0.8 + 2.6 * h01(c, 3) + 0.6 * Math.sin(t * 0.35 + c);   // how far this trickle reaches (body units)
      const x = screen(new THREE.Vector3(c * cw, yFeet, ft.z)).x;
      // rows of the grid below the feet: row R spans y = -(R + 0.9 t) * CV_H ... one row lower
      for (let R = Math.ceil(-yFeet / CV_H - 0.9 * t); ; R++) {
        const y = -(R + 0.9 * t) * CV_H, depth = yFeet - y;
        const sy = screen(new THREE.Vector3(c * cw, y, ft.z)).y;
        if (sy > DRIP_END) break;
        let a = depth < len ? 1 - depth / len : (h01(c, R) < 0.03 ? 0.35 : 0);  // a stream that thins out, then loose drops
        if (a <= 0.02) continue;
        a *= 0.75 * Math.min(1, depth / 0.15 + 0.3) / (1 + depth * 0.6);   // darker the lower it gets
        const rr = ((R % ROWS) + ROWS) % ROWS, cc = ((c % COLS) + COLS) % COLS;
        dctx.fillStyle = `rgba(200,200,200,${a.toFixed(3)})`;
        dctx.fillText(DRIP_TXT[(rr * COLS + cc) % DRIP_TXT.length], x, sy);
      }

}

function draw(dt) {
  imgs.forEach((im, p) => { if (im.tagName === 'VIDEO' && im.readyState >= 2) actx.drawImage(im, ...cellOf(p), CELL, CELL); });
  atlas.needsUpdate = true;
  for (let k = 0; k < 9; k++) {                               // Untitled (slot 0) follows the click, the works follow the pointer
    const want = k === FREE ? lit : k === target && !lit;
    hov[k] += ((want ? 1 : 0) - hov[k]) * Math.min(1, dt * 9);
  }
  { const u = mat.uniforms.freeHov; u.value += ((target === FREE && !lit ? 1 : 0) - u.value) * Math.min(1, dt * 9); }
  scanClock += dt;
  mat.uniforms.time.value += dt;
  placeScan(scanClock < SCAN_T ? yTop - (yTop - yBot) * (scanClock / SCAN_T) : -99);
  // after the pass the green fades out over 1.2 s; the AI voice is green while the line is passing
  const glow = scanClock < SCAN_T ? 1 : Math.max(0, 1 - (scanClock - SCAN_T) / 1.2);
  mat.uniforms.scanGlow.value = glow;
  if (scanClock >= SCAN_T && glow > 0) mat.uniforms.scanY.value = yBot;
  logEl.classList.toggle('green', scanClock < SCAN_T + 0.4);
  document.body.classList.toggle('scanning', scanClock < SCAN_T + 0.4);

    nextLine -= dt;
    if (typing) { typing.n += dt * 45; if (typing.n >= voice.text(logLines.at(-1), lang).length) typing = null; renderLog(); }
    else if (nextLine <= 0) { pushLine(false); nextLine = 1.2 + Math.random() * 1.2; }
  }

}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;

}
if (REC) {
  if (Q.get('open')) setTimeout(() => openWork(PARTS.find(w => w.id === Q.get('open'))), 0);
  // stills: fixed hover (?hover=N), scan line at ?sy= (body units), log filled with ?lines= lines, videos at ?vt= s
  const HV = Q.has('hover') ? +Q.get('hover') : -1;
  if (HV >= 0) setTarget(HV);
  if (HV === FREE) setLit(true);                               // stills: ?hover=0 shows Untitled switched on

    const PW = +Q.get('pw'), PH = +Q.get('ph'), T = +(Q.get('tile') || 2048), cols = Math.ceil(PW / T);
    const visH = sz.y / 0.94;                                  // the body fills 94 % of the height

    const pdist = Math.max(visH, sz.x * 1.2 * PH / PW) / 2 / Math.tan(13 * Math.PI / 180);
    camera.aspect = PW / PH; camera.position.set(ctr.x, ctr.y, ctr.z + pdist); camera.lookAt(ctr.x, ctr.y, ctr.z);

    if (Q.has('fh')) { setTarget(FREE); mat.uniforms.freeHov.value = 1; }   // stills: Untitled hovered (not clicked)
    if (Q.has('t')) mat.uniforms.time.value = +Q.get("t") + i / 30;   // stills / clips of the halo

    if (Q.has('sy')) { placeScan(+Q.get('sy')); halo(); }
  };
  if (Q.get('open')) setTimeout(() => { window.__ready = true; }, 5000); else if (!PRINT)
  window.__ready = true;
} else requestAnimationFrame(frame);
addEventListener('pointerdown', () => imgs.forEach(im => im.play && im.play().catch(() => {})), { once: true });
