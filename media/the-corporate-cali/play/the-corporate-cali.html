<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Corporate Cali</title>
<style>
  html, body { margin:0; height:100%; background:#000; color:#aaa; overflow:hidden;
    font-family: DOSVGA, "Courier New", monospace; -webkit-user-select:none; user-select:none; }
  #wrap { position:absolute; inset:0 0 56px 0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; cursor:grab; background:#000; }
  canvas.drag { cursor:grabbing; }
  #bar { position:absolute; left:0; right:0; bottom:0; height:56px; display:flex; align-items:center;
    justify-content:center; gap:14px; font-size:24px; }
  #bar button { font:inherit; color:#000; background:#aaa; border:0; padding:2px 14px; cursor:pointer; }
  #bar button:hover, #bar button.on { background:#fff; }
  #track { position:relative; width:min(40vw, 360px); height:24px; cursor:pointer; }
  #track::before { content:""; position:absolute; left:0; right:0; top:11px; height:2px; background:#555; }
  #knob { position:absolute; top:0; width:12px; height:24px; background:#fff; margin-left:-6px; }
  #lvl { width:5.5em; text-align:left; }
  #hint { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#000; color:#fff;
    border:2px solid #aaa; padding:14px 22px; font-size:24px; line-height:1.4; text-align:center;
    pointer-events:none; transition:opacity .8s; white-space:nowrap; }
  #hint.off { opacity:0; }
  body.render #bar, body.render #hint { display:none; }
  /* 27 Oct (Carlos): no zoom any more: the whole picture, no bar, no hint */
  body.nozoom #bar, body.nozoom #hint.ready { display:none; }
  body.nozoom canvas { cursor:default; }
  body.nozoom #wrap { inset:0; }
  body.render #wrap { inset:0; }
  @media (max-width:520px) {
    #wrap { bottom:48px; }
    #bar { height:48px; gap:8px; font-size:18px; }
    #bar button { padding:2px 10px; }
    #track { width:28vw; }
    #lvl { width:4em; }
    #hint { font-size:16px; padding:10px 14px; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="hint">LOADING...</div></div>
<div id="bar">
  <button id="out" title="Zoom out">−</button>
  <div id="track"><div id="knob"></div></div>
  <button id="in" title="Zoom in">+</button>
  <span id="lvl">1.0×</span>
  <button id="reset" title="See the whole portrait">FIT</button>
</div>
<script src="data.js"></script>
<script>const IMG_DIR = '';   // where cells_*.js, night.jpg and cc_*.jpg are ('' in the published copy)</script>
<script>
(async function () {
  const Q = new URLSearchParams(location.search);
  // ?lang=en|es = his new CV, text only (27 Oct 2026). Shown as an IMAGE since then (cc_en.png / cc_es.png, 4096 px, rasterised
  // from the-corporate-cali_en/es.pdf by cv2026/pdf2img.swift); the PDF + PDF.js viewer is in works/_backup/.
  // the language: ?lang=, else the one chosen on the site (localStorage au_lang, same as the entrance pages), else English
  let LANG = Q.get('lang');
  if (!LANG) try { LANG = localStorage.getItem('au_lang'); } catch (e) {}
  LANG = LANG === 'es' ? 'es' : 'en';
  document.documentElement.lang = LANG;
  const RENDER = Q.has('render');
  if (RENDER) document.body.classList.add('render');

  const font = new FontFace('DOSVGA', `url(${CC_FONT})`);   // for the zoom bar and the hint
  await font.load(); document.fonts.add(font);

  // --- LIVE (27 Oct, Carlos): the photo Night.png, and over it every letter of the CV drawn each frame, each one ONE flat colour
  // that drifts very slowly toward the photo's own colour there (almost vanishing into it) and back to its brighter colour.
  // Data: cells_<lang>.js (grid, text, raw = photo colour, tone = letter colour; cv2026/build.py) + night.jpg. ?zoom = old picture.
  const V = '20261028x';
  const cellsOK = !Q.has('zoom') && await new Promise(ok => { const sc = document.createElement('script');
    sc.src = `${IMG_DIR}cells_${LANG}.js?v=${V}`; sc.onload = () => ok(true); sc.onerror = () => ok(false); document.head.appendChild(sc); });
  if (cellsOK) {
    const C = window.CC_CELLS, cv = document.getElementById('c'), ctx0 = cv.getContext('2d'), ctx = ctx0;
    const photo = new Image(); photo.src = `${IMG_DIR}night.jpg?v=${V}`; await photo.decode();
    document.body.classList.add('nozoom'); document.getElementById('hint').classList.add('ready');
    const N = C.text.length, PERIOD = +(Q.get('period') || 5), LOW = +(Q.get('low') ?? 0.06);   // LOW: how close to the photo it gets
    // which letters fade: AREAS, small and large, that drift and disperse (not waves): two octaves of smooth 3D value noise
    // (x, y, time) on the letter grid, the large one also bent by the small one so the patches break up as they move
    const hash = (x, y, z) => { const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return h - Math.floor(h); };
    const sm = t => t * t * (3 - 2 * t);
    function noise(x, y, z) {
      const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z), u = sm(x - X), v = sm(y - Y), w = sm(z - Z);
      const L = (a, b, t) => a + (b - a) * t;
      return L(L(L(hash(X, Y, Z), hash(X + 1, Y, Z), u), L(hash(X, Y + 1, Z), hash(X + 1, Y + 1, Z), u), v),
               L(L(hash(X, Y, Z + 1), hash(X + 1, Y, Z + 1), u), L(hash(X, Y + 1, Z + 1), hash(X + 1, Y + 1, Z + 1), u), v), w);
    }
    // a little more contrast in the letters (Carlos): whites whiter, darks darker, around mid gray
    const CON = +(Q.get('con') || 1);                        // Carlos asked to remove the extra contrast again (1.35 -> 1)
    for (let k = 0; k < C.tone.length; k++) C.tone[k] = Math.min(255, Math.max(0, (C.tone[k] - 110) * CON + 110));
    const BIG = +(Q.get('big') || 10), SMALL = +(Q.get('small') || 3.5);   // smaller patches (Carlos: no big blocks at once)   // patch sizes, in letters (rows count double: cells are 1:2)
    // now and then (every 1-2 s) one or two random PAIRS of consecutive words light up a little: they come forward, a bit
    // brighter, then settle back (half the time rising, half fading)
    const words = []; { const re = /\S+/g, all = []; let mm; while ((mm = re.exec(C.text))) all.push([mm.index, mm.index + mm[0].length]);
      for (let j = 0; j + 1 < all.length; j++) if (all[j + 1][1] - all[j][0] > 6) words.push([all[j][0], all[j + 1][1]]); }
    const glow = new Float32Array(N), lit = [];               // lit: [first, last, start time]
    const LIFT = +(Q.get('lift') || 0.35), GLOW_T = 5.5;   // 5.5 s (Carlos): half rising, half fading      // how much brighter (toward white), and for how long (s)
    // The lit words follow a SEEDED schedule (3 Nov 2026): one or two pairs every 1-2 s, from t = -8 s on, so the picture at any
    // time t is reproducible (the preview video is rendered frame by frame) and the same on every visit.
    const rnd = (a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; })(7);
    const sched = []; for (let tt = -8; tt < 7200; tt += 1 + rnd()) for (let k = 1 + Math.floor(rnd() * 2); k > 0; k--) { const w = words[Math.floor(rnd() * words.length)]; sched.push([w[0], w[1], tt]); }
    function words_(t) {
      glow.fill(0);
      for (const [a0, a1, s0] of sched) {
        const a = (t - s0) / GLOW_T; if (a <= 0 || a >= 1) continue;
        const e = Math.sin(Math.PI * a);                      // in and out, smoothly
        for (let i = a0; i < a1; i++) glow[i] = Math.max(glow[i], e);
      }
    }
    let S = 0, kx = 1;
    function fit() {
      if (RENDER) S = +(Q.get('size') || Math.min(innerWidth, innerHeight));   // the window size set by tools/render_frames.sh
      else { const w = document.getElementById('wrap'), css = Math.floor(Math.min(w.clientWidth, w.clientHeight)), dpr = window.devicePixelRatio || 1;
        S = Math.round(css * dpr); cv.style.width = cv.style.height = css + 'px'; }
      cv.width = cv.height = S;
      if (RENDER) cv.style.width = cv.style.height = S + 'px';
      ctx.font = `${S / C.rows}px DOSVGA`; kx = (S / C.cols) / ctx.measureText('M').width;
    }
    function paint(t, ctx = ctx0) {
      const cw = S / C.cols, chh = S / C.rows;
      words_(t);
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(photo, 0, 0, S, S);
      ctx.setTransform(kx, 0, 0, 1, 0, 0); ctx.font = `${chh}px DOSVGA`; ctx.textBaseline = 'middle';
      for (let i = 0; i < N; i++) {
        const ch = C.text[i]; if (ch === ' ') continue;
        const r = Math.floor(i / C.cols), c = i % C.cols, ts = t / PERIOD;
        const s = noise(c / SMALL - ts * .9, 2 * r / SMALL + ts * .4, ts * 1.7 + 50);   // the patches also travel across the page
        const b = noise(c / BIG + s * .8 + ts * .5, 2 * r / BIG + s * .8 - ts * .3, ts);
        let u = Math.min(1, Math.max(0, (0.45 * b + 0.55 * s - 0.57) * 2.6 + 0.5)); u = sm(u);   // biased: fewer letters fully shown at a time
        const g = glow[i], m = Math.max(LOW + (1 - LOW) * u, g), k = 3 * i, lift = LIFT * g;   // a lit word is fully shown, and lifted
        const R = C.raw[k] + (C.tone[k] - C.raw[k]) * m, G = C.raw[k + 1] + (C.tone[k + 1] - C.raw[k + 1]) * m, B = C.raw[k + 2] + (C.tone[k + 2] - C.raw[k + 2]) * m;
        ctx.fillStyle = `rgb(${R + (255 - R) * lift | 0},${G + (255 - G) * lift | 0},${B + (255 - B) * lift | 0})`;
        ctx.fillText(ch, c * cw / kx, (r + 0.5) * chh);
      }
    }
    fit();
    if (RENDER) {
      // the preview video: a seamless loop of LOOP seconds; its last FADE seconds cross-fade into the picture from before t = 0
      const t = +(Q.get('t') || 0), LOOP = +(Q.get('loop') || 12), FADE = +(Q.get('fade') || 1.5);
      paint(t);
      if (Q.has('loop') || Q.has('t')) { const w = (t - (LOOP - FADE)) / FADE; if (w > 0) {
        const c2 = document.createElement('canvas'); c2.width = c2.height = S; paint(t - LOOP, c2.getContext('2d'));
        ctx0.setTransform(1, 0, 0, 1, 0, 0); ctx0.globalAlpha = Math.min(1, w); ctx0.drawImage(c2, 0, 0); ctx0.globalAlpha = 1; } }
      document.title = 'done'; return;
    }
    addEventListener('resize', () => { fit(); });
    const t0 = performance.now(); let last = 0;
    (function tick(now) { if (now - last > 1000 / 30) { last = now; paint((now - t0) / 1000); } requestAnimationFrame(tick); })(t0);
    return;
  }

  // --- what is shown: the square picture of the CV in the chosen language
  const img = new Image(); img.src = `${IMG_DIR}cc_${LANG}.jpg?v=20261028o`; await img.decode();
  const IW = img.naturalWidth;

  // draws the region of the picture seen at zoom z around (cx, cy) into a size x size canvas
  function renderRegion(canvas, size, z, cx, cy) {
    const sc = size * z, c2 = canvas.getContext('2d');
    c2.setTransform(1, 0, 0, 1, 0, 0); c2.fillStyle = '#000'; c2.fillRect(0, 0, size, size);
    c2.imageSmoothingEnabled = true; c2.imageSmoothingQuality = 'high';
    c2.drawImage(img, size / 2 - cx * sc, size / 2 - cy * sc, sc, sc);
    return Promise.resolve();
  }

  // --- canvas and view (world = the unit square)
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const NOZOOM = !Q.has('zoom');         // 27 Oct (Carlos): no zoom; ?zoom brings the 1-4x zoom back
  const ZMIN = 1, ZMAX = 4;              // 4x (Carlos, 27 Oct: smaller pictures, 4096 px, load faster)
  const view = { z: 1, cx: .5, cy: .5 }, goal = { z: 1, cx: .5, cy: .5 };
  let S = 0, DPR = 1;

  function size() {
    if (RENDER) { S = +(Q.get('size') || 1440); DPR = 1; cv.width = cv.height = S; cv.style.width = cv.style.height = S + 'px'; return; }
    const w = document.getElementById('wrap');
    const css = Math.floor(Math.min(w.clientWidth, w.clientHeight));
    DPR = window.devicePixelRatio || 1;
    S = Math.round(css * DPR);
    cv.width = cv.height = S; cv.style.width = cv.style.height = css + 'px';
    det.ok = false;
    // on a tall screen (phone) the zoom bar sits right under the portrait, not at the bottom of the window
    const bar = document.getElementById('bar'), r = cv.getBoundingClientRect();
    bar.style.top = Math.min(innerHeight - bar.offsetHeight, r.bottom) + 'px'; bar.style.bottom = 'auto';
  }

  function clamp() {
    for (const v of [goal, view]) {
      v.z = Math.min(ZMAX, Math.max(ZMIN, v.z));
      const half = 0.5 / v.z;
      v.cx = Math.min(1 - half, Math.max(half, v.cx));
      v.cy = Math.min(1 - half, Math.max(half, v.cy));
    }
  }

  // the grid/preview video (?render=1&t=seconds): a 12 s seamless loop. Close-up on "ReducedHRdataerrorsby90%"
  // (row 27 of option A), zoom out to the whole face, hold, zoom back in. The phrase stays put on screen while zooming.
  function videoView(t) {
    const T = 12, P = { z: 3.6, cx: 0.4554, cy: 0.5093 };
    const ease = u => u * u * (3 - 2 * u);
    t = ((t % T) + T) % T;
    const out = t < 2 ? 0 : t < 6 ? ease((t - 2) / 4) : t < 8 ? 1 : 1 - ease((t - 8) / 4);   // 0 = close-up, 1 = whole
    const z = Math.exp(Math.log(P.z) * (1 - out)), u = (1 - 1 / z) / (1 - 1 / P.z);
    return { z, cx: 0.5 + (P.cx - 0.5) * u, cy: 0.5 + (P.cy - 0.5) * u };
  }

  const det = { cv: document.createElement('canvas'), ok: false, busy: false, z: 0, cx: 0, cy: 0 };
  size(); clamp();
  if (RENDER) {
    if (Q.has('t')) Object.assign(view, videoView(+Q.get('t')));
    else { view.z = +(Q.get('z') || 1); view.cx = +(Q.get('cx') || .5); view.cy = +(Q.get('cy') || .5); }
    clamp();
    await renderRegion(cv, S, view.z, view.cx, view.cy); document.title = 'done'; return;
  }

  // whole page once, sharp up to about 2x; while zooming it is scaled, and once the view rests
  // the visible region is drawn again from the PDF at screen resolution (det)
  const base = document.createElement('canvas');
  base.width = base.height = Math.min(4096, Math.max(2048, Math.round(S * 2)));
  await renderRegion(base, base.width, 1, .5, .5);
  if (NOZOOM) {                                              // no zoom (27 Oct): draw the whole picture and stop here
    document.body.classList.add('nozoom'); document.getElementById('hint').classList.add('ready');
    size(); draw(); addEventListener('resize', () => { size(); draw(); });
    return;
  }
  document.getElementById('hint').innerHTML = 'SCROLL OR PINCH TO ZOOM IN AND OUT<br>DRAG TO MOVE';

  function draw() {
    const sc = S * view.z, ox = S / 2 - view.cx * sc, oy = S / 2 - view.cy * sc;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S, S);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(base, ox, oy, sc, sc);
    if (det.ok) {
      const w = sc / det.z;
      ctx.drawImage(det.cv, ox + (det.cx - .5 / det.z) * sc, oy + (det.cy - .5 / det.z) * sc, w, w);
    }
  }

  let still = 0;                                             // ms the view has been at rest
  async function detail() {
    if (det.busy || S * view.z <= base.width * 0.95) return;
    if (det.ok && det.z === view.z && det.cx === view.cx && det.cy === view.cy && det.cv.width === S) return;
    det.busy = true;
    const z = view.z, cx = view.cx, cy = view.cy, c = document.createElement('canvas');
    c.width = c.height = S;
    try { await renderRegion(c, S, z, cx, cy); Object.assign(det, { cv: c, ok: true, z, cx, cy }); draw(); }
    finally { det.busy = false; }
  }

  // --- interaction: progressive (eased) zoom toward a goal
  const hint = document.getElementById('hint');
  let hinted = false;
  const unhint = () => { if (!hinted) { hinted = true; hint.classList.add('off'); } };
  setTimeout(unhint, 6000);                                  // counted from the moment the portrait is shown

  function toWorld(px, py) {                                 // css px on canvas -> world, using the goal view
    const r = cv.getBoundingClientRect(), sc = r.width * goal.z;
    return [goal.cx + (px - r.left - r.width / 2) / sc, goal.cy + (py - r.top - r.height / 2) / sc];
  }
  function zoomAt(f, px, py) {                               // keep the point under the pointer fixed
    const r = cv.getBoundingClientRect();
    if (px == null) { px = r.left + r.width / 2; py = r.top + r.height / 2; }
    const [wx, wy] = toWorld(px, py);
    goal.z = Math.min(ZMAX, Math.max(ZMIN, goal.z * f));
    const sc = r.width * goal.z;
    goal.cx = wx - (px - r.left - r.width / 2) / sc;
    goal.cy = wy - (py - r.top - r.height / 2) / sc;
    clamp(); unhint();
  }

  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    zoomAt(Math.exp(-d * (e.ctrlKey ? 0.01 : 0.0025)), e.clientX, e.clientY);
  }, { passive: false });

  const pts = new Map(); let pinch = null;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); cv.classList.add('drag'); pinch = null; unhint(); });
  cv.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) {
      const r = cv.getBoundingClientRect(), sc = r.width * goal.z;
      goal.cx -= (e.clientX - prev[0]) / sc; goal.cy -= (e.clientY - prev[1]) / sc; clamp();
      view.cx = goal.cx; view.cy = goal.cy;                   // dragging follows the hand at once
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]), mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      if (pinch) zoomAt(d / pinch, mx, my);
      pinch = d;
    }
  });
  const up = e => { pts.delete(e.pointerId); pinch = null; if (!pts.size) cv.classList.remove('drag'); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('dblclick', e => zoomAt(2.5, e.clientX, e.clientY));

  // buttons: a click = one smooth step, holding = keeps zooming
  let hold = 0;
  function holdBtn(id, dir) {
    const b = document.getElementById(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); zoomAt(dir > 0 ? 1.6 : 1 / 1.6); hold = dir; b.classList.add('on'); });
    const stop = () => { hold = 0; b.classList.remove('on'); };
    b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop);
  }
  holdBtn('in', 1); holdBtn('out', -1);
  document.getElementById('reset').onclick = () => { goal.z = 1; goal.cx = goal.cy = .5; unhint(); };
  addEventListener('keydown', e => {
    if (e.key === '+' || e.key === '=') zoomAt(1.6);
    else if (e.key === '-' || e.key === '_') zoomAt(1 / 1.6);
    else if (e.key === '0') { goal.z = 1; goal.cx = goal.cy = .5; }
  });

  // slider (logarithmic)
  const track = document.getElementById('track'), knob = document.getElementById('knob'), lvl = document.getElementById('lvl');
  let sliding = false;
  function slideTo(x) {
    const r = track.getBoundingClientRect(), u = Math.min(1, Math.max(0, (x - r.left) / r.width));
    zoomAt(Math.exp(Math.log(ZMIN) + u * (Math.log(ZMAX) - Math.log(ZMIN))) / goal.z);
  }
  track.addEventListener('pointerdown', e => { sliding = true; track.setPointerCapture(e.pointerId); slideTo(e.clientX); });
  track.addEventListener('pointermove', e => { if (sliding) slideTo(e.clientX); });
  track.addEventListener('pointerup', () => sliding = false);

  addEventListener('resize', () => { size(); draw(); still = 0; });

  let last = performance.now(), drawn = '';
  (function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (hold) zoomAt(Math.exp(hold * 1.2 * dt));
    const k = 1 - Math.exp(-dt * 7);
    view.z += (goal.z - view.z) * k; view.cx += (goal.cx - view.cx) * k; view.cy += (goal.cy - view.cy) * k;
    if (Math.abs(goal.z - view.z) < 1e-4 * goal.z) { view.z = goal.z; view.cx = goal.cx; view.cy = goal.cy; }
    clamp();
    const key = view.z + ',' + view.cx + ',' + view.cy + ',' + S;
    if (key !== drawn) { draw(); drawn = key; still = 0; }
    else if ((still += dt * 1000) > 150) detail();
    const u = (Math.log(view.z) - Math.log(ZMIN)) / (Math.log(ZMAX) - Math.log(ZMIN));
    knob.style.left = (u * 100) + '%';
    lvl.textContent = view.z.toFixed(1) + '×';
    requestAnimationFrame(tick);
  })(last);
})();
</script>
</body>
</html>
