<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1534" height="1080"></canvas>
<script src="manifest.js"></script>
<script src="cvr.js"></script>
<script>
// render.html?render=1&t=<seconds>  : one frame of the self-playing loop (CVR.LOOP.length s), drawn once
// optional: &cfg=<json overrides> &bg=<image> &intro=1  (used to re-create earlier studies)
const q = new URLSearchParams(location.search);
if (q.get('cfg')) Object.assign(CVR.CFG, JSON.parse(q.get('cfg')));
const c = document.getElementById('c');
if (q.get('w')) { c.width = +q.get('w'); c.height = +q.get('h'); }
CVR.loadAssets('', q.get('bg')).then(A => {
  const ctx = c.getContext('2d');
  if (q.get('intro')) { new CVR.Scene(A).drawIntro(ctx, c.width, c.height); return; }
  const t = parseFloat(q.get('t') || '0');
  if (q.get('applies')) {                  // single scripted clicks instead of the loop
    const S = new CVR.Scene(A, +(q.get('seed') || 5));
    q.get('applies').split(',').map(Number).forEach(x => S.apply(x, q.get('recruiter') !== '0'));
    for (let x = 0; x < t; x += 1 / 120) S.step(x);
    S.step(t); S.draw(ctx, c.width, c.height);
  } else CVR.loopSceneAt(A, t).draw(ctx, c.width, c.height);
  document.title = 'ready';
});
</script></body></html>
