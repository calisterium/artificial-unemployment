<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-play-I</title>
<style>
@font-face { font-family:'VT323'; src:url('fonts/VT323-Regular.ttf'); }
:root { --ink:#120a2a; --magenta:#ff3fd0; }
html, body { margin:0; height:100%; background:#000; overflow:hidden; }
body { display:flex; align-items:center; justify-content:center; }
#stage { position:relative; width:1440px; height:1440px; overflow:hidden; transform-origin:center; flex:none;
  font-family:'Times New Roman', Times, serif; color:#fff; user-select:none; -webkit-user-select:none; }
#world { position:absolute; inset:0; }

/* ---------- background: Fortnite sky + rays under an 80% gray, net.art tiles, scanlines ---------- */
#sky { position:absolute; inset:0;
  background:radial-gradient(ellipse 55% 45% at var(--cx,50%) 55%, rgba(140,235,255,.85) 0%, rgba(80,170,255,.35) 35%, rgba(0,0,0,0) 70%),
    linear-gradient(180deg, #2a0f7a 0%, #2238c9 38%, #2f86f2 70%, #63d6ff 100%); }
#rays { position:absolute; left:-40%; top:-40%; width:180%; height:180%;
  background:repeating-conic-gradient(from 0deg at var(--cx,50%) 54%, rgba(255,255,255,.13) 0deg 6deg, rgba(255,255,255,0) 6deg 15deg);
  -webkit-mask:radial-gradient(circle at var(--cx,50%) 54%, #000 0%, #000 22%, transparent 48%);
          mask:radial-gradient(circle at var(--cx,50%) 54%, #000 0%, #000 22%, transparent 48%); }
#tiles { position:absolute; inset:0; opacity:.16; mix-blend-mode:screen;
  background-image:radial-gradient(circle at 50% 50%, #fff 0 1.6px, transparent 2.2px),
    linear-gradient(45deg, transparent 46%, rgba(255,255,255,.5) 47% 53%, transparent 54%);
  background-size:48px 48px, 96px 96px; }
#gray { position:absolute; inset:0; background:#bdbdbd; opacity:.8; }
#scan { position:absolute; inset:0; pointer-events:none; opacity:.10; background:repeating-linear-gradient(0deg, #000 0 2px, transparent 2px 4px); }
canvas#gl { position:absolute; inset:0; width:1440px; height:1440px; }
canvas#static { position:absolute; inset:0; width:1440px; height:1440px; pointer-events:none; opacity:0; }
#flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }

/* ---------- screens ---------- */
.scr { position:absolute; inset:0; display:none; }
.scr.on { display:block; }

/* title: chrome WordArt, A and I big, play small */
.title { position:absolute; line-height:.8; white-space:nowrap; font-weight:bold; font-style:italic; }
.title span { display:inline-block; background:linear-gradient(180deg, #ffffff 0%, #d6e4ff 30%, #6b7fa8 48%, #f4f7ff 52%, #9fb1d6 75%, #ffffff 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.title .play { background:linear-gradient(180deg, #fff9c4 0%, #ffe14d 40%, #ff7ad9 55%, #ff3fd0 100%); -webkit-background-clip:text; background-clip:text; }
.title.big { left:0; right:0; top:10px; text-align:center; letter-spacing:-4px; filter:drop-shadow(10px 10px 0 var(--ink)) drop-shadow(0 0 28px rgba(255,63,208,.7)); }
.title.big span { -webkit-text-stroke:5px var(--ink); }
.title.big .big { font-size:420px; } .title.big .play { font-size:192px; vertical-align:24px; margin:0 8px; }
.title.big .dash { font-size:240px; vertical-align:60px; margin:0 -12px; }
.title.small { left:48px; top:28px; letter-spacing:-2px; filter:drop-shadow(5px 5px 0 var(--ink)) drop-shadow(0 0 14px rgba(255,63,208,.7)); }
.title.small span { -webkit-text-stroke:3px var(--ink); }
.title.small .big { font-size:150px; } .title.small .play { font-size:69px; vertical-align:9px; margin:0 3px; }
.title.small .dash { font-size:86px; vertical-align:21px; margin:0 -4px; }

/* chrome push button (START / NEXT / SUBMIT) */
.btn { position:absolute; display:block; box-sizing:border-box; padding:0; text-align:center; cursor:pointer;
  font-family:'Times New Roman', Times, serif; font-weight:bold; line-height:1; color:var(--ink);
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.14) 0 2px, transparent 2px 5px),
    linear-gradient(180deg, #ffffff 0%, #d6e4ff 30%, #6b7fa8 48%, #f4f7ff 52%, #9fb1d6 75%, #ffffff 100%);
  border:7px solid; border-color:#ffffff #4a5a80 #4a5a80 #ffffff; outline:3px solid var(--ink);
  box-shadow:0 0 50px rgba(255,63,208,.55), 16px 18px 0 var(--ink); }
.btn:active, .btn.down { border-color:#4a5a80 #ffffff #ffffff #4a5a80; transform:translate(8px,9px); box-shadow:0 0 50px rgba(255,63,208,.55), 8px 9px 0 var(--ink); }
.btn.start { left:120px; top:1110px; width:1200px; height:280px; font-size:192px; letter-spacing:8px; border-width:12px; outline-width:5px; }
.btn.next { left:56px; top:1190px; width:830px; height:170px; font-size:110px; letter-spacing:4px; }

.q { position:absolute; left:56px; top:196px; font-weight:bold; font-size:62px; color:#000; white-space:nowrap; }
.q .hint { font-size:44px; font-weight:normal; }

/* screen 2: three words + seniority cards */
#words { position:absolute; left:56px; top:290px; display:flex; gap:20px; }
#words input { width:262px; height:84px; box-sizing:border-box; padding:0 18px; background:#fff; border:5px solid; border-color:#404040 #fff #fff #404040;
  box-shadow:inset 3px 3px 0 #808080, 8px 8px 0 rgba(18,10,42,.45); font:42px 'Times New Roman', Times, serif; color:#000; outline:none; border-radius:0; }
#words input::placeholder { color:#9a9aa8; font-style:italic; }
#cards { position:absolute; left:56px; top:496px; width:830px; display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; }
.card { position:relative; height:166px; overflow:hidden; cursor:pointer;
  background:radial-gradient(ellipse 70% 70% at 50% 38%, var(--l) 0%, var(--m) 55%, var(--d) 100%);
  border:9px solid; border-color:var(--l) var(--d) var(--d) var(--l); outline:4px solid var(--ink);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25), 9px 10px 0 var(--ink); }
.card::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(-55deg, rgba(255,255,255,.10) 0 10px, transparent 10px 24px); }
.card .name { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:bold; font-size:42px; line-height:1; color:#fff;
  text-shadow:3px 3px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); }
.card.sel { border-color:var(--d) var(--l) var(--l) var(--d); transform:translate(5px,6px);
  box-shadow:inset 4px 4px 10px rgba(0,0,0,.35), 0 0 0 9px #ff8fcf, 0 0 40px 16px rgba(255,63,208,.7), 4px 4px 0 var(--ink); }
.card.sel .name { transform:translate(2px,3px); }

/* screen 3: vertical slider, High at the bottom */
#vslider { position:absolute; left:56px; top:300px; width:830px; height:860px; cursor:pointer; touch-action:none; }
#vslider .track { position:absolute; left:70px; top:40px; width:60px; height:780px; box-sizing:border-box; background:#e8e8ee;
  border:6px solid; border-color:#404040 #fff #fff #404040; box-shadow:inset 3px 3px 0 #808080, 8px 8px 0 rgba(18,10,42,.35); overflow:hidden; }
#vslider .fill { position:absolute; left:0; right:0; bottom:0;
  background:linear-gradient(0deg, #8c97a8 4%, #4fc93a 23%, #2f8cff 42%, #b14bff 61%, #ff9330 80%, #f5c428 99%); background-size:100% 768px; background-position:bottom; }
#vslider .tick { position:absolute; left:150px; width:40px; height:6px; background:var(--ink); }
#vslider .lab { position:absolute; left:214px; transform:translateY(-50%); font-weight:bold; font-size:56px; line-height:1; color:#3a3a46; white-space:nowrap; }
#vslider .lab.on { color:#000; font-size:72px; }
#vslider .knob, .dz .knob { box-sizing:border-box; border:7px solid; border-color:#ffffff #4a5a80 #4a5a80 #ffffff; outline:4px solid var(--ink); }
#vslider .knob { position:absolute; left:30px; width:140px; height:72px; transform:translateY(-50%);
  background:repeating-linear-gradient(90deg, transparent 0 52px, rgba(18,10,42,.35) 52px 55px, transparent 55px 61px, rgba(18,10,42,.35) 61px 64px, transparent 64px 70px, rgba(18,10,42,.35) 70px 73px, transparent 73px),
    linear-gradient(180deg, #ffffff 0%, #d6e4ff 30%, #6b7fa8 48%, #f4f7ff 52%, #9fb1d6 75%, #ffffff 100%);
  box-shadow:0 0 30px rgba(255,63,208,.6), 8px 9px 0 var(--ink); }

/* screen 4: radio buttons */
#radios { position:absolute; left:56px; top:390px; display:flex; flex-direction:column; gap:110px; }
.radio { display:flex; align-items:center; gap:34px; font-weight:bold; font-size:68px; line-height:1; color:#000; cursor:pointer; }
.radio .dot { position:relative; flex:none; width:84px; height:84px; border-radius:50%; background:#fff; box-sizing:border-box;
  border:6px solid; border-color:#404040 #fff #fff #404040; box-shadow:inset 4px 4px 0 #808080, 6px 7px 0 rgba(18,10,42,.35); }
.radio.on .dot::after { content:''; position:absolute; left:50%; top:50%; width:38px; height:38px; margin:-19px 0 0 -19px; border-radius:50%; background:#000; }

/* screen 5: list box */
#list { position:absolute; left:56px; top:330px; width:780px; box-sizing:border-box; padding:6px 70px 6px 6px; background:#fff;
  border:6px solid; border-color:#404040 #fff #fff #404040; box-shadow:inset 3px 3px 0 #808080, 10px 10px 0 rgba(18,10,42,.35); }
#list .opt { height:140px; padding:0 30px; font-weight:bold; font-size:68px; line-height:140px; color:#000; cursor:pointer; }
#list .opt + .opt { border-top:2px dotted #b8b8c4; }
#list .opt.on { background:#1c0f86; color:#fff; outline:3px dotted #ff8fcf; outline-offset:-6px; }
#list .sb { position:absolute; right:6px; top:6px; bottom:6px; width:58px; background-image:repeating-conic-gradient(#c0c0c0 0 25%, #e8e8e8 0 50%); background-size:6px 6px; }
#list .sb i, #list .sb b { position:absolute; left:0; right:0; display:block; height:58px; box-sizing:border-box; background:#c0c0c0; border:4px solid; border-color:#fff #404040 #404040 #fff;
  font-style:normal; font-size:24px; line-height:50px; text-align:center; color:#000; }
#list .sb i:first-child { top:0; } #list .sb i:last-child { bottom:0; } #list .sb b { top:62px; height:150px; }

/* screen 6 */
#num { position:absolute; left:40px; top:320px; line-height:.9; white-space:nowrap; font-weight:bold; font-style:italic; letter-spacing:-6px;
  filter:drop-shadow(10px 10px 0 var(--ink)) drop-shadow(0 0 28px rgba(255,63,208,.7)); }
#num span, #congrats span { display:inline-block; background:linear-gradient(180deg, #ffffff 0%, #d6e4ff 30%, #6b7fa8 48%, #f4f7ff 52%, #9fb1d6 75%, #ffffff 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-stroke:5px var(--ink); }
#num span { font-size:300px; padding-right:20px; }
#jobs { top:640px; }
.link { position:absolute; color:#0000ee; text-decoration:underline; cursor:pointer; }
.link:active { color:#ee0000; }
#applyall { top:790px; font-size:152px; line-height:1.08; text-align:center; text-decoration-thickness:8px; text-underline-offset:16px; }

/* screen 7 */
#congrats { position:absolute; left:0; right:0; top:14px; text-align:center; line-height:.9; white-space:nowrap; font-weight:bold; font-style:italic;
  letter-spacing:-6px; filter:drop-shadow(10px 10px 0 var(--ink)) drop-shadow(0 0 28px rgba(255,63,208,.7)); }
#congrats span { font-size:220px; padding-right:24px; }
#applied { position:absolute; left:0; right:0; top:236px; text-align:center; font-weight:bold; font-size:60px; color:#000; white-space:nowrap; }
#dance { position:absolute; left:56px; top:1060px; width:880px; }
.dz { display:flex; align-items:center; height:64px; }
.dz .lab { flex:none; width:250px; font-weight:bold; font-size:44px; color:#000; }
.dz .track { flex:none; position:relative; width:540px; height:34px; box-sizing:border-box; background:#e8e8ee; cursor:pointer; touch-action:none;
  border:5px solid; border-color:#404040 #fff #fff #404040; box-shadow:inset 3px 3px 0 #808080; }
.dz .track::after { content:''; position:absolute; left:-10px; right:-10px; top:-18px; bottom:-18px; }    /* bigger grab area */
.dz .fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, #ff8fcf, #b14bff 50%, #5fd3ff); background-size:530px 100%; }
.dz .knob { position:absolute; top:50%; width:40px; height:62px; transform:translate(-50%,-50%); border-width:5px; outline-width:3px; z-index:1;
  background:linear-gradient(90deg, #ffffff 0%, #d6e4ff 30%, #6b7fa8 48%, #f4f7ff 52%, #9fb1d6 75%, #ffffff 100%);
  box-shadow:0 0 16px rgba(255,63,208,.6), 5px 6px 0 var(--ink); }
.dz .val { margin-left:34px; font-family:'VT323', monospace; font-size:40px; color:#000; white-space:nowrap; }
/* the words to try again: outside the degrading world, never degrade */
#restart { text-shadow:0 0 6px #fff, 0 0 12px #fff, 0 0 18px #fff; right:56px; top:1250px; width:440px; text-align:center; font-size:64px; line-height:1.1; text-decoration-thickness:4px; text-underline-offset:8px; display:none; z-index:5; }

/* screen 7: the whole page is painted into one picture (canvas) so it all degrades together;
   the HTML sliders stay on top, invisible, to be dragged */
#stage.flat #sky, #stage.flat #rays, #stage.flat #tiles, #stage.flat #gray, #stage.flat #scan { display:none; }
#stage.flat #s7 { opacity:0; }
/* review bar (?bar) */
#bar { position:fixed; left:8px; top:8px; z-index:10; font:13px/1.4 monospace; color:#fff; background:rgba(0,0,0,.75); padding:6px 8px; display:none; }
#bar button { font:12px monospace; }
#bar input[type=range] { width:180px; vertical-align:middle; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="vhs.js"></script>
<script src="audio.js"></script>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="sky"></div><div id="rays"></div><div id="tiles"></div><div id="gray"></div>
    <canvas id="gl" width="1440" height="1440"></canvas>
    <div id="scan"></div>
    <div class="ui">
      <section class="scr" id="s1">
        <div class="title big"><span class="big">A</span><span class="dash">-</span><span class="play">play</span><span class="dash">-</span><span class="big">I</span></div>
        <button class="btn start" data-go="2">START</button>
      </section>
      <section class="scr" id="s2">
        <div class="q">Describe the job you want in 3 words:</div>
        <div id="words"><input maxlength="20" placeholder="word 1" spellcheck="false"><input maxlength="20" placeholder="word 2" spellcheck="false"><input maxlength="20" placeholder="word 3" spellcheck="false"></div>
        <div class="q" style="top:408px">Seniority: <span class="hint">(choose one or more)</span></div>
        <div id="cards"></div>
        <button class="btn next" data-go="3">NEXT</button>
      </section>
      <section class="scr" id="s3">
        <div class="q">Increase Job Match:</div>
        <div id="vslider"><div class="track"><div class="fill"></div></div><div class="knob"></div></div>
        <button class="btn next" data-go="4">NEXT</button>
      </section>
      <section class="scr" id="s4">
        <div class="q">Have you ever had a pet?</div>
        <div id="radios"></div>
        <button class="btn next" data-go="5">NEXT</button>
      </section>
      <section class="scr" id="s5">
        <div class="q">Which race is your pet?</div>
        <div id="list"><div class="sb"><i>&#9650;</i><b></b><i>&#9660;</i></div></div>
        <button class="btn next" data-go="6">SUBMIT</button>
      </section>
      <section class="scr" id="s6">
        <div class="q">Your AI applier has found</div>
        <div id="num"><span>99,999</span></div>
        <div class="q" id="jobs">jobs.</div>
        <a class="link" id="applyall" href="#">APPLY TO ALL JOBS AT ONCE!</a>
      </section>
      <section class="scr" id="s7">
        <div id="congrats"><span>CONGRATS!</span></div>
        <div id="applied">YOU HAVE APPLIED TO <span id="n">0</span> JOBS!</div>
        <div id="dance"></div>
      </section>
    </div>
  </div>
  <canvas id="static" width="720" height="720"></canvas>
  <a class="link" id="restart" href="#">Click here to restart!</a>
  <div id="flash"></div>
</div>
<div id="bar"></div>

<script>
// ===================== interface (screens, controls) =====================
const Q = new URLSearchParams(location.search);
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const stage = $('#stage');
let SCALE = 1;
function fit() { SCALE = Math.min(innerWidth, innerHeight) / 1440; stage.style.transform = `scale(${SCALE})`; }
addEventListener('resize', fit); fit();

// labels exactly as in Carlos' spreadsheet
const SENIORITY = [
  ['Intern', '#d7dde6','#8c97a8','#4f5a6b'], ['Analyst', '#b8f59a','#4fc93a','#21691a'], ['Specialist', '#9fd2ff','#2f8cff','#123f9a'],
  ['Manager', '#e2b3ff','#b14bff','#561a93'], ['Sr Manager', '#ffd2a3','#ff9330','#a2420a'], ['Director', '#fff0a8','#f5c428','#8f6608'],
  ['Sr Director', '#b8fff4','#2fd8c8','#0a6e6e'], ['Executive', '#ffb0e4','#e0329f','#5a0b4a'], ['Whichever', '#ffffff','#f6f6f8','#cfd0d8'],
];
const MATCH = ['High', 'Higher', 'Highest', 'Superhighest', 'Megahighest', 'Max forever'];
const PET = ['Yes', 'No', 'I dont want to answer'];
const RACE = ['Milaneso', 'Güero', 'Caramelo', 'Latino', 'Full breed'];
const DANCE = [['tempo', 'Tempo', .5], ['bounce', 'Bounce', .6], ['sway', 'Hip sway', .5], ['arms', 'Arms', .7], ['chaos', 'Chaos', .15]];
const sfx = n => (...a) => window.APA && APA.sfx[n](...a);

// screen 2
$('#cards').innerHTML = SENIORITY.map(([n, l, m, d]) => `<div class="card" style="--l:${l};--m:${m};--d:${d}"><div class="name">${n}</div></div>`).join('');
$$('.card').forEach(c => c.addEventListener('click', () => { c.classList.toggle('sel'); sfx('select')(c.classList.contains('sel')); }));
$$('#words input').forEach(i => i.addEventListener('keydown', e => { if (e.key === ' ') e.preventDefault(); sfx('key')(); }));

// screen 3: vertical slider with 6 stops
const VS = $('#vslider'), Y0 = 820, STEP = 148;
MATCH.forEach((n, i) => VS.insertAdjacentHTML('beforeend', `<div class="tick" style="top:${Y0 - i * STEP - 33}px"></div><div class="lab" style="top:${Y0 - i * STEP - 30}px">${n}</div>`));
let matchV = 0;
function setMatch(v, snap) {
  v = Math.max(0, Math.min(5, v)); if (snap) v = Math.round(v);
  const old = Math.round(matchV); matchV = v;
  const ky = Y0 - v * STEP - 30;
  $('.knob', VS).style.top = ky + 'px'; $('.fill', VS).style.height = Math.max(0, 814 - ky) + 'px';
  $$('.lab', VS).forEach((l, i) => l.classList.toggle('on', i === Math.round(v)));
  if (Math.round(v) !== old) sfx('tick')(Math.round(v));
}
function dragV(e) { const r = VS.getBoundingClientRect(); const y = (e.clientY - r.top) / SCALE; setMatch((Y0 - 30 - y) / STEP, false); }
VS.addEventListener('pointerdown', e => { VS.setPointerCapture(e.pointerId); dragV(e); VS.onpointermove = dragV; });
VS.addEventListener('pointerup', () => { VS.onpointermove = null; setMatch(matchV, true); });

// screen 4: radios
$('#radios').innerHTML = PET.map(n => `<label class="radio"><span class="dot"></span>${n}</label>`).join('');
$$('.radio').forEach(r => r.addEventListener('click', () => { $$('.radio').forEach(x => x.classList.toggle('on', x === r)); sfx('click')(); }));

// screen 5: list box
$('#list').insertAdjacentHTML('afterbegin', RACE.map(n => `<div class="opt">${n}</div>`).join(''));
$$('#list .opt').forEach(o => o.addEventListener('click', () => { $$('#list .opt').forEach(x => x.classList.toggle('on', x === o)); sfx('click')(); }));

// screen 6: centre the link on the centre of "99,999"
function centreApplyAll() {
  const n = $('#num span'), l = $('#applyall');
  const cx = n.parentElement.offsetLeft + n.offsetLeft + (n.offsetWidth - 20) / 2, w = 2 * Math.min(cx, 1440 - cx) - 8;
  l.style.width = w + 'px'; l.style.left = (cx - w / 2) + 'px';
}

// screen 7: the 5 dance sliders
const DV = {};
$('#dance').innerHTML = DANCE.map(([k, n]) => `<div class="dz" data-k="${k}"><div class="lab">${n}</div><div class="track"><div class="fill"></div><div class="knob"></div></div><div class="val"></div></div>`).join('');
function setDance(k, v) {
  v = Math.max(0, Math.min(1, v)); DV[k] = v;
  const row = $(`.dz[data-k="${k}"]`);
  $('.fill', row).style.width = v * 100 + '%'; $('.knob', row).style.left = v * 100 + '%';
  if (k === 'tempo') { $('.val', row).textContent = bpmOf(v) + ' BPM'; window.APA && APA.setBpm(bpmOf(v)); }
  if (k === 'chaos') window.APA && APA.setChaos(v);
}
const bpmOf = v => Math.round(60 + v * 120);           // 60 .. 180 BPM
$$('.dz').forEach(row => {
  const tr = $('.track', row), k = row.dataset.k; let last = -1;
  const drag = e => { const r = tr.getBoundingClientRect(); const v = (e.clientX - r.left) / r.width; setDance(k, v);
    const q = Math.round(DV[k] * 10); if (q !== last) { last = q; sfx('tick')(q * 0.6); } };
  tr.addEventListener('pointerdown', e => { tr.setPointerCapture(e.pointerId); drag(e); tr.onpointermove = drag; });
  tr.addEventListener('pointerup', () => { tr.onpointermove = null; });
});

function resetAnswers() {
  $$('#words input').forEach(i => i.value = '');
  $$('.card').forEach(c => c.classList.remove('sel'));
  $$('.radio, #list .opt').forEach(x => x.classList.remove('on'));
  setMatch(0, true);
  DANCE.forEach(([k, , v]) => setDance(k, v));

  // robot: only on screen 7, pops in after the fanfare
  robotIn = screen === 7 ? Math.min(1, robotIn + dt / 0.5) : 0;
  robot.visible = rShadow.visible = robotIn > 0;
  if (robot.visible) {        // the robot copies the gummy's pose exactly (not a mirror)
    const Jr = solve(pose, false), pop = robotIn < 1 ? 1 + 2.7 * Math.pow(robotIn - 1, 3) + 1.7 * Math.pow(robotIn - 1, 2) : 1;
    poseRobot(Jr, 0.05 * d * d);
    robot.position.set(0.7, 0, 0); robot.rotation.y = 0.12; robot.scale.setScalar(Math.max(0.001, pop));
    rShadow.position.set(0.7 + Jr.P.x * 0.6, 0.006, 0.02);
  }

  // monitors drift
  for (const k in monitorGroups) if (monitorGroups[k].visible) monitorGroups[k].children.forEach((m, i) => {
    const b = m.userData.base; m.position.y = b.p[1] + 0.05 * Math.sin(T * 0.8 + i * 1.7); m.rotation.y = b.r[1] + 0.12 * Math.sin(T * 0.45 + i);
  });

  // light direction for the toon materials (view space)
  const lv = LIGHT.clone().transformDirection(camera.matrixWorldInverse);
  for (const m of toonMats) m.uniforms.uLight.value.copy(lv);
  gummyU.uLight.value.copy(LIGHT);

  // render: screens 1-6 straight; screen 7 as one picture through the degrading pass
  if (!DRAW) {}
  else if (screen !== 7) { renderer.setRenderTarget(null); renderer.render(scene, camera); }
  else {
    paintUI7();
    renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    postU.uD.value = d; postU.uTime.value = T; postU.uBlock.value = 1 + Math.floor(Math.pow(d, 1.6) * 36);
    renderer.render(postScene, postCam);
  }
  // the static creeps in over the whole picture at once: flashes first, then it stays; at 1.5 minutes it is all there is
  if (d > 0) {
    const base = Math.pow(clamp01((d - 0.3) / 0.7), 1.4), burst = Math.random() < d * 0.06 ? 0.35 + 0.4 * Math.random() : 0;
    const a = Math.min(1, Math.max(base, burst * d));
    sCanvas.style.opacity = a.toFixed(3);
    if (a > 0 && DRAW) { sU.uT.value = T; sRenderer.render(sScene, postCam); }
  } else sCanvas.style.opacity = 0;

  if (!RENDER) requestAnimationFrame(() => frame());
}
document.fonts && document.fonts.load('40px VT323').then(() => { uiKey = ''; });
// ---------- essay: restart when the game leaves the view and comes back ----------
if (EMBED && 'IntersectionObserver' in window) {
  let away = false;
  new IntersectionObserver(es => { for (const e of es) {
    if (e.intersectionRatio < 0.1) { if (!away) { away = true; window.APA && APA.pause(); } }
    else if (away && e.intersectionRatio >= 0.5) {
      away = false;
      if (screen === 7) go(1, true);                 // back to the start, polished again
      window.APA && APA.resume();
    }
  } }, { threshold:[0, 0.1, 0.5, 1] }).observe(stage);
}

// ---------- the self-playing loop for the grid (23 s = 690 frames) ----------
const LOOP = 23;
const SCRIPT = [
  [1.45, () => $('.btn.start').classList.add('down')], [1.6, () => { $('.btn.start').classList.remove('down'); go(2, true); }],
  ...[...'any job please'].map((ch, i) => [2.2 + i * 0.08, () => { const w = 'any job please'.slice(0, i + 1).split(' ');
      $$('#words input').forEach((inp, k) => inp.value = w[k] || ''); }]),
  [3.6, () => $$('.card')[8].classList.add('sel')], [3.85, () => $$('.card')[7].classList.add('sel')],
  [4.25, () => $('#s2 .btn').classList.add('down')], [4.4, () => { $('#s2 .btn').classList.remove('down'); go(3, true); }],
  ...[...Array(13)].map((_, i) => [4.8 + i * 0.1, () => setMatch(i === 12 ? 5 : i * 5 / 12, i === 12)]),
  [6.25, () => $('#s3 .btn').classList.add('down')], [6.4, () => { $('#s3 .btn').classList.remove('down'); go(4, true); }],
  [7.0, () => $$('.radio')[2].classList.add('on')],
  [7.65, () => $('#s4 .btn').classList.add('down')], [7.8, () => { $('#s4 .btn').classList.remove('down'); go(5, true); }],
  [8.4, () => $$('#list .opt')[2].classList.add('on')],
  [9.05, () => $('#s5 .btn').classList.add('down')], [9.2, () => { $('#s5 .btn').classList.remove('down'); go(6, true); }],
  [10.8, () => $('#applyall').style.color = '#ee0000'], [11.0, () => { $('#applyall').style.color = ''; go(7, true); degSpeed = 9; }],
];
async function renderAt(t) {
  await document.fonts.ready; await document.fonts.load('40px VT323');
  const n = Math.round(t * 30); DRAW = false; let k = 0;
  go(1, true);
  for (let i = 0; i < n; i++) {
    const ti = (i + 1) / 30;
    while (k < SCRIPT.length && SCRIPT[k][0] <= ti) SCRIPT[k++][1]();
    frame(1 / 30);
  }
  DRAW = true; uiKey = ''; frame(0);
  window.__done = true;
}
// start
if (RENDER) { $('#bar').style.display = 'none'; renderAt(+(Q.get('t') || 0) % LOOP); }
else { go(+(Q.get('screen') || 1), true); frame(); }
window.__ready = true;
</script>
