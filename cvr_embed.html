<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Candidates VS Recruiters</title>
<style>
  html, body { margin:0; height:100%; background:#fff; overflow:hidden; }
  html, body { touch-action:manipulation; }
  canvas { display:block; width:100%; height:100%; touch-action:manipulation; }
</style>
<script>
// iOS Safari zooms in on a double tap (Carlos, 3 Nov 2026: unplayable on iPad): a second tap within 350 ms is swallowed
(function () { let last = 0; document.addEventListener('touchend', e => { const t = Date.now(); if (t - last < 350) e.preventDefault(); last = t; }, { passive: false }); })();
</script>
</head>
<body>
<!-- the game exactly as in essay.html section 02, only without the page around it -->
<canvas id="cvr" width="1534" height="1080"></canvas>
<script src="au_sound.js?v=20261104b"></script>
<script src="media/02-candidates-vs-recruiters/game/manifest.js"></script>
<script src="media/02-candidates-vs-recruiters/game/cvr.js?v=20261104j"></script>
<script>CVR.mountGame(document.getElementById('cvr'), 'media/02-candidates-vs-recruiters/game/', false);</script>
</body>
</html>
